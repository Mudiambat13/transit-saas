server {
  listen 80;
  client_max_body_size 5m;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://backend:8000; }
  location /media/ { alias /media/; }
  location / { proxy_pass http://frontend:80; }
}
